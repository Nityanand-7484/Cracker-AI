<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 612" role="img" aria-label="How Cracker AI works" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .t{font-size:12px;font-weight:700;letter-spacing:1px}
  .n{font-size:13px;font-weight:700;fill:#f0f6fc}
  .s{font-size:11px;fill:#8b949e}
  .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-12}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>
  .card{fill:#161b22;stroke:#30363d;stroke-width:1.5;animation:glow 7s linear infinite}
  @keyframes glow{0%,13%{stroke:#ff7700;fill:#21262d}15%,100%{stroke:#30363d;fill:#161b22}}
  .dot{animation:move 7s linear infinite}
  @keyframes move{0%{transform:translateY(0);opacity:1}85%{transform:translateY(504px);opacity:1}92%,100%{transform:translateY(504px);opacity:0}}
</style>
<rect width="480" height="612" rx="18" fill="#0d1117" stroke="#30363d"/>
<line x1="40" y1="54.0" x2="40" y2="558.0" stroke="#30363d" stroke-width="2" class="flow"/>
<circle cx="40" cy="54.0" r="5" fill="#ff7700" class="dot"/>
<rect x="72" y="24" width="388" height="60" rx="12" class="card" style="animation-delay:0s"/>
<text x="90" y="50" class="n">Question is spoken</text>
<text x="90" y="69" class="s">Interviewer audio reaches your client</text>
<circle cx="40" cy="54.0" r="16" fill="#0d1117" stroke="#ff7700" stroke-width="2"/>
<text x="40" y="59.0" text-anchor="middle" class="n">1</text>
<rect x="72" y="108" width="388" height="60" rx="12" class="card" style="animation-delay:1s"/>
<text x="90" y="134" class="n">Audio streams out</text>
<text x="90" y="153" class="s">Web app or Electron to the WebSocket relay</text>
<circle cx="40" cy="138.0" r="16" fill="#0d1117" stroke="#ff7700" stroke-width="2"/>
<text x="40" y="143.0" text-anchor="middle" class="n">2</text>
<rect x="72" y="192" width="388" height="60" rx="12" class="card" style="animation-delay:2s"/>
<text x="90" y="218" class="n">Speech-to-text</text>
<text x="90" y="237" class="s">Deepgram sends interim + final transcripts</text>
<circle cx="40" cy="222.0" r="16" fill="#0d1117" stroke="#ff7700" stroke-width="2"/>
<text x="40" y="227.0" text-anchor="middle" class="n">3</text>
<rect x="72" y="276" width="388" height="60" rx="12" class="card" style="animation-delay:3s"/>
<text x="90" y="302" class="n">Transcript hits the API</text>
<text x="90" y="321" class="s">Next.js handler receives transcript chunks</text>
<circle cx="40" cy="306.0" r="16" fill="#0d1117" stroke="#ff7700" stroke-width="2"/>
<text x="40" y="311.0" text-anchor="middle" class="n">4</text>
<rect x="72" y="360" width="388" height="60" rx="12" class="card" style="animation-delay:4s"/>
<text x="90" y="386" class="n">Context lookup (RAG)</text>
<text x="90" y="405" class="s">Firestore findNearest on resume + projects</text>
<circle cx="40" cy="390.0" r="16" fill="#0d1117" stroke="#ff7700" stroke-width="2"/>
<text x="40" y="395.0" text-anchor="middle" class="n">5</text>
<rect x="72" y="444" width="388" height="60" rx="12" class="card" style="animation-delay:5s"/>
<text x="90" y="470" class="n">Answer generation</text>
<text x="90" y="489" class="s">GPT-4o gets the prompt + retrieved context</text>
<circle cx="40" cy="474.0" r="16" fill="#0d1117" stroke="#ff7700" stroke-width="2"/>
<text x="40" y="479.0" text-anchor="middle" class="n">6</text>
<rect x="72" y="528" width="388" height="60" rx="12" class="card" style="animation-delay:6s"/>
<text x="90" y="554" class="n">Live answer in your HUD</text>
<text x="90" y="573" class="s">Streamed token by token over SSE</text>
<circle cx="40" cy="558.0" r="16" fill="#0d1117" stroke="#ff7700" stroke-width="2"/>
<text x="40" y="563.0" text-anchor="middle" class="n">7</text>
</svg>